# Configuration de l'API. Toutes les valeurs surchageables par variable d'environnement
server:
  port: ${PORT:8545}
  # Pour X-Forwarded-Proto (nginx/Cloudflare TLS termination).
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: INM5151 Scan API
  # Upload photo de plat (POST /v1/scan/dish). Limite raisonnable pour une photo mobile.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:scan}
    password: ${DATABASE_PASSWORD:scan}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

springdoc:
  swagger-ui:
    path: /docs

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 jours

scan:
  app-name: INM5151 Scan API
  environment: ${ENVIRONMENT:development}
  database-url: ${DATABASE_URL:}
  # APIs externes open data.
  off-base-url: ${OFF_BASE_URL:https://world.openfoodfacts.org}
  obf-base-url: ${OBF_BASE_URL:https://world.openbeautyfacts.org}
  off-user-agent: '${OFF_USER_AGENT:INM5151-ScanApp/0.1 (contact: ton-email@uqam.ca)}'
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.5-flash}
  fdc-api-key: ${FDC_API_KEY:DEMO_KEY}
  fdc-base-url: ${FDC_BASE_URL:https://api.nal.usda.gov}
  encryption-master-key: ${ENCRYPTION_MASTER_KEY:}
