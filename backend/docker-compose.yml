services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
    volumes:
      - ./app:/app/app          # hot-reload du code en dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports: ["5000:5000"]
    environment:
      LT_LOAD_ONLY: "en,fr,zh"
    volumes:
      - lt_models:/home/libretranslate/.local   

  # ─────────────────────────────────────────────────────────────────────────
  # PADDLEOCR 
  # Il N'EXISTE PAS d'image "paddlepaddle/paddleocr:latest" qui expose une
  # API HTTP toute prête sur le port 8001. Le compose du .md ne démarrera pas.
  # Deux options réelles :
  #   A) Écris ton propre wrapper FastAPI autour du package pip `paddleocr`
  #      dans un dossier ./ocr (avec son Dockerfile), puis décommente :
  # ocr:
  #   build: ./ocr
  #   ports: ["8001:8001"]
  #   B) Image communautaire (port souvent 8080), ex. jarvis1tube/paddleocr-server
  #      — vérifie le port et l'API exacte avant de t'appuyer dessus.
  # ─────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  lt_models:
