services:
  api:
    build: .
    ports: ['127.0.0.1:8545:8545']
    env_file: .env
    restart: on-failure:5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-scan}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-scan}
      POSTGRES_DB: scan
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-scan} -d scan']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
