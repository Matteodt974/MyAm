services:
  api:
    build: .
    ports: ['8080:8080'] # le backend FastAPI occupe 8000 ; Spring est sur 8080
    env_file: .env
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan
    # Port HOTE 5433 pour ne pas entrer en conflit avec la stack FastAPI (5432).
    # Dans le reseau compose, le service reste joignable sur db:5432 (DATABASE_URL inchange).
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    # Port HOTE 5001 pour ne pas entrer en conflit avec la stack FastAPI (5000).
    ports: ['5001:5000']
    environment:
      LT_LOAD_ONLY: 'en,fr,zh'
    volumes:
      - lt_models:/home/libretranslate/.local

  # ─────────────────────────────────────────────────────────────────────────
  # PADDLEOCR
  # Il N'EXISTE PAS d'image "paddlepaddle/paddleocr:latest" qui expose une API HTTP
  #   A) Ecris ton propre wrapper FastAPI autour du package pip `paddleocr` dans un
  #      dossier ./ocr (avec son Dockerfile), puis decommente :
  # ocr:
  #   build: ./ocr
  #   ports: ["8001:8001"]
  #   B) Image communautaire (port souvent 8080) — verifie le port et l'API avant.
  # ─────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  lt_models:
