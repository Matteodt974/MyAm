name: Release
# Inspired by plezy's release job: https://github.com/edde746/plezy/blob/main/.github/workflows/release.yml
on:
  workflow_dispatch:
    branches:
      - main
    inputs:
      version:
        description: 'Version number'
        required: true
        type: string
      release_name:
        description: 'Release title (e.g., Sprint 1). Defaults to version if blank.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Pre-release?'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  prepare:
    name: Bump Versions & Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.release_name }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be in X.Y.Z format"
            exit 1
          fi

      - name: Bump version in pubspec.yaml
        working-directory: frontend
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          BUILD=$(echo "$CURRENT" | cut -d'+' -f2)
          NEW_BUILD=$((BUILD + 1))
          sed -i "s/^version: .*/version: $VERSION+$NEW_BUILD/" pubspec.yaml

      - name: Bump pom.xml version
        run: |
          sed -i '/<artifactId>scan<\/artifactId>/{n;s|<version>[^<]*</version>|<version>'"$VERSION"'</version>|}' backend/pom.xml

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/pubspec.yaml backend/pom.xml
          git commit -m "chore: bump version to $VERSION"
          git tag "$VERSION"
          git push origin main
          git push origin --tags

  build-apk:
    name: Build Flutter APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      SUBDOMAIN: ${{ secrets.SUBDOMAIN }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=BACKEND_URL="https://$SUBDOMAIN"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  build-ipa:
    name: Build iOS IPA (unsigned)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      SUBDOMAIN: ${{ secrets.SUBDOMAIN }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=BACKEND_URL="https://$SUBDOMAIN"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r myam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipa
          path: frontend/myam.ipa

  build-jar:
    name: Build Spring Boot JAR
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn -f backend/pom.xml -C package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jar
          path: backend/target/scan-${{ inputs.version }}.jar

  create-release:
    name: Create GitHub Release
    needs: [build-apk, build-ipa, build-jar]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.release_name }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/apk/app-release.apk artifacts/myam-$VERSION.apk
          mv artifacts/ipa/myam.ipa artifacts/myam-$VERSION.ipa
          mv artifacts/jar/scan-$VERSION.jar artifacts/myam-backend-$VERSION.jar

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)

          {
            echo "## ${RELEASE_NAME:-MyAm $VERSION}"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo "### Changes"

            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "Changes since \`$PREVIOUS_TAG\`:"
              echo
              git log "$PREVIOUS_TAG..$VERSION" \
                --pretty=format:'- %s - %an - (%h)' \
                --no-merges
            else
              echo
              echo "Initial Release."
              echo
              git log "$VERSION" \
                --pretty=format:'- %s - %an - (%h)' \
                --no-merges
            fi
          } > artifacts/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('MyAm {0}', inputs.version) }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/myam-${{ inputs.version }}.apk
            artifacts/myam-${{ inputs.version }}.ipa
            artifacts/myam-backend-${{ inputs.version }}.jar
          draft: true
          prerelease: ${{ inputs.prerelease }}

  deploy:
    name: Deploy to app.ageei.org
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SITE}}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            cd $DEPLOY_PATH
            git pull origin main
            cd backend
            docker compose up --build -d
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
