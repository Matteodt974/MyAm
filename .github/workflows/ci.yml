name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: scan
          POSTGRES_PASSWORD: scan
          POSTGRES_DB: scan
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + tests (mvnw package)
        run: ./mvnw -B -ntp package

  frontend:
    name: Run Frontend Static Analysis & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter Dependencies
        run: flutter pub get

      - name: Generer le code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Static Analysis & Tests
        run: |
          flutter analyze
          flutter test
