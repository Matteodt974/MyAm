name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Smoke test (import de l'app)
        run: python -c "from app.main import app; print('import OK')"
      - name: Tests (si présents)
        run: |
          if ls tests/*.py test_*.py >/dev/null 2>&1; then
            pip install pytest
            pytest -q
          else
            echo "Pas encore de tests backend — étape ignorée."
          fi

  backend_spring:
    name: Backend · Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + tests (compile, contextLoads)
        run: ./mvnw -B -ntp package

  frontend:
    name: Frontend · Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
