# Deployed on gserver at /etc/nginx/conf.d/api-myallergymon.conf

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name api.myallergymon.ca;

    ssl_certificate /etc/nginx/ssl/myallergymon/myallergymon.crt;
    ssl_certificate_key /etc/nginx/ssl/myallergymon/myallergymon.key;

    location / {
        proxy_pass http://127.0.0.1:8545/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
    }
}
